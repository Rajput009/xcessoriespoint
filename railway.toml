[build]
dockerfilePath = "Dockerfile"

[deploy]
# must be /api/health — bare /health is served by the static handler in
# production (dist/ present) and returns 404 to the healthcheck
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
numReplicas = 1

[env]
NODE_ENV = "production"
XP_DB_PATH = "/data/store.db"
# Set XP_BASE_URL to your real domain (or assigned *.up.railway.app URL) after
# deploy — sitemap, OG tags and canonical URLs all derive from it. See DEPLOY.md.
XP_BASE_URL = ""

[[volumes]]
name = "data"
mountPath = "/data"
